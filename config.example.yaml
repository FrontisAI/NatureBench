run:
  dataset_id: FrontisAI/NatureBench
  dataset_revision: null
  data_dir: ./data/naturebench_data
  skip_download: false
  download_only: false

  tasks: gpu_low
  out_dir: ./results/claude_<model-name>_gpu_low
  dry_run: false

  agent: claude
  model: <model-name>
  mode: base
  timeout: 14400
  setup_timeout: 14400
  max_workers: 4

  skip_build: true
  base_image: naturebench-base:v3
  dockerfile_name: Dockerfile.v3
  ensure_base_image: true

  eval_port: null
  eval_env_mapping: ./eval_env_mapping.json
  start_eval_services: true
  eval_log_dir: null
  skip_judge: false

  gpu_devices: 0,1,2,3
  gpu_pool_file: null
  gpu_skip_busy_mb: null
  gpu_skip_busy_util: null
  shared_gpu_task_file: null
  shared_gpu_device: null
  shared_gpu_slots: null
  shared_gpu_pool_file: null

  proxy_mode: none
  proxy_bundle: null
  proxy_container: null
  proxy_network: null
  proxy_http_port: null
  proxy_socks_port: null

  codex_auth_dir: null
  codex_auth_mode: null

  resume_tasks: []
  resume_task_file: null
  resume_only: false
  force_fresh: []
  force_fresh_task_file: null

  solve_args: []
